<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>MotionJSON Ecommerce Template</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      background: #e9edf2;
      color: #151922;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .gallery {
      display: grid;
      place-items: center;
      padding: 28px;
      background: #ffffff;
    }
    #motion {
      width: min(780px, 100%);
      aspect-ratio: 1 / 1;
      border: 1px solid #c8d0da;
      background: #ffffff;
    }
    #motion canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    aside {
      display: grid;
      align-content: start;
      gap: 16px;
      padding: 24px;
      border-left: 1px solid #c8d0da;
      background: #f7f9fb;
    }
    h1 {
      margin: 0;
      font-size: 1.65rem;
      line-height: 1.1;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #556170;
      line-height: 1.5;
    }
    .swatches {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      min-height: 38px;
      border: 1px solid #b8c3cf;
      border-radius: 6px;
      padding: 0 12px;
      background: #ffffff;
      color: #151922;
      font-weight: 750;
      cursor: pointer;
    }
    button:hover { border-color: #1e8a78; }
    @media (max-width: 780px) {
      body { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid #c8d0da; }
    }
  </style>
</head>
<body>
  <main class="gallery">
    <div
      id="motion"
      data-motionjson-src=""
      data-motionjson-template="ecommerce"
      data-motionjson-background="#ffffff"
    ></div>
  </main>
  <aside>
    <h1>Interactive product graphic</h1>
    <p>The product layer stays cached. Selection, hover, and product-page states remain lightweight JSON changes.</p>
    <div class="swatches">
      <button data-state="idle">Idle</button>
      <button data-state="hover">Inspect</button>
      <button data-state="click">Select</button>
    </div>
    <p id="status">Loading template...</p>
  </aside>
  <script type="module">
    const path = location.pathname;
    const fromPreview = path.includes("/preview/website_templates/");
    const fromPackage = !path.includes("/examples/") && path.includes("/templates/");
    const runtimePath = fromPreview || fromPackage
      ? "../runtime/index.js"
      : "../../packages/motionjson-runtime/src/index.js";
    const { autoMountMotionJSON } = await import(runtimePath);
    const params = new URLSearchParams(location.search);
    const fallbackManifest = fromPreview ? "../../web_asset_manifest.json" : fromPackage ? "../web_asset_manifest.json" : "/out/demo/web_asset_manifest.json";
    document.getElementById("motion").dataset.motionjsonSrc = params.get("manifest") || fallbackManifest;
    const [handle] = await autoMountMotionJSON();
    document.getElementById("status").textContent = `Loaded ${handle.scene.assetId} from cached assets.`;
    for (const button of document.querySelectorAll("button[data-state]")) {
      button.addEventListener("click", () => handle.runtime.setState(button.dataset.state));
    }
  </script>
</body>
</html>
