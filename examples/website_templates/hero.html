<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>MotionJSON Hero Template</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111319;
      color: #f5f2ea;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .hero {
      min-height: 86vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      border-bottom: 1px solid #313743;
    }
    .stage {
      min-width: 0;
      display: grid;
      place-items: center;
      background: #f7f3ea;
      padding: 28px;
    }
    .copy {
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 32px;
      background: #191d25;
      border-left: 1px solid #313743;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 5.6rem);
      line-height: .94;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #b6bdc9;
      line-height: 1.55;
      max-width: 34rem;
    }
    #motion {
      width: min(980px, 100%);
      aspect-ratio: 16 / 10;
      border: 1px solid rgba(17, 19, 25, .18);
      background: #fbfaf6;
      box-shadow: 0 18px 54px rgba(0, 0, 0, .22);
    }
    #motion canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      min-height: 40px;
      border: 1px solid #3b4351;
      border-radius: 6px;
      padding: 0 13px;
      background: #222936;
      color: #f5f2ea;
      font-weight: 750;
      cursor: pointer;
    }
    button:hover { border-color: #68c5b6; }
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; }
      .copy { border-left: 0; border-top: 1px solid #313743; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <section class="stage">
      <div
        id="motion"
        data-motionjson-src=""
        data-motionjson-template="hero"
        data-motionjson-background="#fbfaf6"
      ></div>
    </section>
    <section class="copy">
      <h1>Reusable motion layers for websites.</h1>
      <p>Use a cached raster/alpha object as a hero graphic, then drive hover, click, and scroll changes with JSON transforms.</p>
      <div class="actions">
        <button id="idle">Idle</button>
        <button id="hover">Hover</button>
        <button id="click">Click</button>
      </div>
      <p id="status">Loading template...</p>
    </section>
  </main>
  <script type="module">
    const path = location.pathname;
    const fromPreview = path.includes("/preview/website_templates/");
    const fromPackage = !path.includes("/examples/") && path.includes("/templates/");
    const runtimePath = fromPreview || fromPackage
      ? "../runtime/index.js"
      : "../../packages/motionjson-runtime/src/index.js";
    const { autoMountMotionJSON } = await import(runtimePath);
    const params = new URLSearchParams(location.search);
    const fallbackManifest = fromPreview ? "../../web_asset_manifest.json" : fromPackage ? "../web_asset_manifest.json" : "/out/demo/web_asset_manifest.json";
    document.getElementById("motion").dataset.motionjsonSrc = params.get("manifest") || fallbackManifest;
    const [handle] = await autoMountMotionJSON();
    document.getElementById("status").textContent = `Loaded ${handle.scene.label} with the ${handle.template.id} template.`;
    document.getElementById("idle").addEventListener("click", () => handle.runtime.setState("idle"));
    document.getElementById("hover").addEventListener("click", () => handle.runtime.setState("hover"));
    document.getElementById("click").addEventListener("click", () => handle.runtime.setState("click"));
  </script>
</body>
</html>
