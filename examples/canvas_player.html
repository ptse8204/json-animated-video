<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>MotionJSON Canvas Runtime</title>
  <style>
    :root {
      --bg: #15161a;
      --panel: #202228;
      --panel-2: #292c33;
      --text: #f4f1ea;
      --muted: #a9adb8;
      --line: #3a3e47;
      --accent: #6dc9b8;
      --warn: #f0b35a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(21, 22, 26, .94);
    }
    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
    }
    .status {
      color: var(--muted);
      font-size: .875rem;
      text-align: right;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 1px;
      min-height: calc(100vh - 57px);
      background: var(--line);
    }
    .stage {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 24px;
      background:
        linear-gradient(45deg, #e9e5dc 25%, transparent 25%),
        linear-gradient(-45deg, #e9e5dc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e9e5dc 75%),
        linear-gradient(-45deg, transparent 75%, #e9e5dc 75%);
      background-color: #f7f4ed;
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
    }
    canvas {
      width: min(100%, 1040px);
      height: min(72vh, 640px);
      background: #fbfaf6;
      border: 1px solid rgba(0, 0, 0, .18);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .2);
    }
    aside {
      background: var(--panel);
      padding: 16px;
      overflow: auto;
    }
    .controls {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .row,
    .metric {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .row {
      color: var(--text);
      font-size: .9rem;
      text-transform: none;
      letter-spacing: 0;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover,
    button.active {
      border-color: var(--accent);
      color: #d8fff7;
    }
    .metrics {
      display: grid;
      gap: 8px;
      margin: 16px 0;
      padding: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric {
      color: var(--muted);
      font-size: .875rem;
    }
    .metric strong {
      color: var(--text);
      font-weight: 700;
      text-align: right;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #111216;
      color: #d9efe8;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .warning { color: var(--warn); }
    @media (max-width: 860px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .status { text-align: left; }
      main { grid-template-columns: 1fr; }
      canvas { height: 56vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Canvas2D Runtime</h1>
    <div class="status" id="status">Loading layer...</div>
  </header>
  <main>
    <section class="stage" aria-label="Canvas preview">
      <canvas id="stage"></canvas>
    </section>
    <aside>
      <div class="controls">
        <div class="buttons">
          <button id="toggle">Pause</button>
          <button id="hover">Hover</button>
        </div>
        <label>
          <span class="row"><span>X offset</span><span id="xOut">0px</span></span>
          <input id="x" type="range" min="-180" max="180" value="0" />
        </label>
        <label>
          <span class="row"><span>Y offset</span><span id="yOut">0px</span></span>
          <input id="y" type="range" min="-120" max="120" value="0" />
        </label>
        <label>
          <span class="row"><span>Scale</span><span id="scaleOut">1.00</span></span>
          <input id="scale" type="range" min="50" max="180" value="100" />
        </label>
        <label>
          <span class="row"><span>Rotation</span><span id="rotationOut">0deg</span></span>
          <input id="rotation" type="range" min="-45" max="45" value="0" />
        </label>
        <label>
          <span class="row"><span>Opacity</span><span id="opacityOut">100%</span></span>
          <input id="opacity" type="range" min="0" max="100" value="100" />
        </label>
      </div>
      <div class="metrics" id="metrics"></div>
      <pre id="editJson"></pre>
    </aside>
  </main>
  <script type="module">
    const runtimePath = location.pathname.includes("/preview/")
      ? "./runtime/index.js"
      : "../packages/motionjson-runtime/src/index.js";
    const { createCanvasRuntime, normalizeMotionJSON } = await import(runtimePath);

    const params = new URLSearchParams(location.search);
    const defaultScene = location.pathname.includes("/preview/") ? "../web_asset_manifest.json" : "/out/demo/web_asset_manifest.json";
    const sceneUrl = params.get("scene") || defaultScene;
    const statusEl = document.getElementById("status");
    const metricsEl = document.getElementById("metrics");
    const editJsonEl = document.getElementById("editJson");
    const toggle = document.getElementById("toggle");
    const hover = document.getElementById("hover");
    const inputs = {
      x: document.getElementById("x"),
      y: document.getElementById("y"),
      scale: document.getElementById("scale"),
      rotation: document.getElementById("rotation"),
      opacity: document.getElementById("opacity")
    };
    const outputs = {
      x: document.getElementById("xOut"),
      y: document.getElementById("yOut"),
      scale: document.getElementById("scaleOut"),
      rotation: document.getElementById("rotationOut"),
      opacity: document.getElementById("opacityOut")
    };

    function editState() {
      const edit = {
        translate: [Number(inputs.x.value), Number(inputs.y.value)],
        scale: Number(inputs.scale.value) / 100,
        rotation: Number(inputs.rotation.value) * Math.PI / 180,
        opacity: Number(inputs.opacity.value) / 100
      };
      outputs.x.textContent = `${edit.translate[0]}px`;
      outputs.y.textContent = `${edit.translate[1]}px`;
      outputs.scale.textContent = edit.scale.toFixed(2);
      outputs.rotation.textContent = `${inputs.rotation.value}deg`;
      outputs.opacity.textContent = `${inputs.opacity.value}%`;
      editJsonEl.textContent = JSON.stringify({ layerEdit: edit }, null, 2);
      return edit;
    }

    function metric(label, value) {
      return `<div class="metric"><span>${label}</span><strong>${value ?? "n/a"}</strong></div>`;
    }

    function renderMetrics(scene) {
      const bytes = scene.raw?.estimatedPackageSizes?.websitePackageBytes;
      metricsEl.innerHTML = [
        metric("Document", scene.sourceType),
        metric("Layer", scene.assetId),
        metric("Frames", scene.assets.sequence.length),
        metric("Canvas", `${scene.canvas.width}x${scene.canvas.height}`),
        metric("FPS", Number(scene.canvas.fps || 0).toFixed(2)),
        metric("Package", bytes ? `${Math.round(bytes / 1024)} KB` : null)
      ].join("");
    }

    const response = await fetch(sceneUrl);
    if (!response.ok) throw new Error(`Could not fetch ${sceneUrl}: ${response.status}`);
    const documentJson = await response.json();
    const scene = normalizeMotionJSON(documentJson, { baseUrl: sceneUrl });
    const runtime = createCanvasRuntime(document.getElementById("stage"), scene, {
      background: "#fbfaf6",
      showBounds: true,
      edit: editState()
    });
    await runtime.load();
    runtime.start();
    renderMetrics(scene);
    statusEl.textContent = `Loaded ${scene.assetId} from ${sceneUrl}`;

    toggle.addEventListener("click", () => {
      runtime.setPlaying(!runtime.playing);
      toggle.textContent = runtime.playing ? "Pause" : "Play";
    });
    hover.addEventListener("click", () => {
      const active = runtime.state !== "hover";
      runtime.setState(active ? "hover" : "idle");
      hover.classList.toggle("active", active);
    });
    runtime.scene.rawClickCount = 0;
    document.getElementById("stage").addEventListener("click", () => {
      runtime.scene.rawClickCount += 1;
      runtime.setState("click");
      statusEl.innerHTML = `Click state: <span class="warning">${scene.states.click?.action || "json_transform"}</span> (${runtime.scene.rawClickCount})`;
      setTimeout(() => runtime.setState(hover.classList.contains("active") ? "hover" : "idle"), 180);
    });
    Object.values(inputs).forEach((input) => input.addEventListener("input", () => {
      runtime.setEdit(editState());
    }));
  </script>
</body>
</html>
