<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>MotionJSON Pixi Runtime</title>
  <style>
    :root {
      --bg: #15161a;
      --panel: #202228;
      --text: #f4f1ea;
      --muted: #a9adb8;
      --line: #3a3e47;
      --accent: #6dc9b8;
      --warn: #f0b35a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(21, 22, 26, .94);
    }
    h1 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0;
    }
    .status {
      color: var(--muted);
      text-align: right;
      font-size: .875rem;
    }
    main {
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f4ed;
    }
    #stage {
      width: min(100%, 980px);
      height: min(72vh, 640px);
      border: 1px solid rgba(0, 0, 0, .18);
      background: #fbfaf6;
    }
    #stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .warning { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <h1>Pixi/WebGL Runtime</h1>
    <div class="status" id="status">Loading layer...</div>
  </header>
  <main>
    <div id="stage"></div>
  </main>
  <script type="module">
    const runtimePath = location.pathname.includes("/preview/")
      ? "./runtime/index.js"
      : "../packages/motionjson-runtime/src/index.js";
    const { createPixiRuntime, normalizeMotionJSON } = await import(runtimePath);
    const params = new URLSearchParams(location.search);
    const sceneUrl = params.get("scene") || (location.pathname.includes("/preview/") ? "../web_asset_manifest.json" : "/out/demo/web_asset_manifest.json");
    const response = await fetch(sceneUrl);
    const scene = normalizeMotionJSON(await response.json(), { baseUrl: sceneUrl });
    const runtime = await createPixiRuntime(document.getElementById("stage"), scene, {
      PIXI: window.PIXI,
      background: "#fbfaf6",
      showBounds: true
    });
    await runtime.load?.();
    runtime.start?.();
    document.getElementById("status").innerHTML = runtime.renderer === "pixi"
      ? `Loaded ${scene.assetId} with injected Pixi`
      : `Loaded ${scene.assetId} with <span class="warning">Canvas2D fallback</span>`;
  </script>
</body>
</html>
