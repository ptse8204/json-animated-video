<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>MotionJSON Plain JS Embed</title>
  <style>
    :root {
      --bg: #15161a;
      --panel: #202228;
      --text: #f4f1ea;
      --muted: #a9adb8;
      --line: #3a3e47;
      --accent: #6dc9b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      background: var(--line);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .embed {
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f4ed;
    }
    #motion {
      width: min(100%, 880px);
      height: min(70vh, 560px);
      border: 1px solid rgba(0, 0, 0, .18);
      background: #fbfaf6;
    }
    #motion canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    aside {
      padding: 16px;
      background: var(--panel);
      border-left: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1rem;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: .9rem;
    }
    code {
      display: block;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #d9efe8;
      background: #111216;
      white-space: pre-wrap;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main class="embed">
    <div
      id="motion"
      data-motionjson-src=""
      data-motionjson-background="#fbfaf6"
      data-motionjson-bounds="true"
    ></div>
  </main>
  <aside>
    <h1>Plain JS Embed</h1>
    <p id="status">Loading cached layer...</p>
    <code>&lt;div data-motionjson-src="..."&gt;&lt;/div&gt;</code>
  </aside>
  <script type="module">
    const runtimePath = location.pathname.includes("/preview/")
      ? "./runtime/index.js"
      : "../packages/motionjson-runtime/src/index.js";
    const { autoMountMotionJSON } = await import(runtimePath);
    const params = new URLSearchParams(location.search);
    const manifestUrl = params.get("manifest") || (location.pathname.includes("/preview/") ? "../web_asset_manifest.json" : "/out/demo/web_asset_manifest.json");
    const target = document.getElementById("motion");
    target.dataset.motionjsonSrc = manifestUrl;
    const [handle] = await autoMountMotionJSON(document, {
      onClick: ({ action }) => {
        document.getElementById("status").textContent = `Click action: ${action || "json_transform"}`;
      }
    });
    document.getElementById("status").textContent = `Loaded ${handle.scene.assetId}`;
  </script>
</body>
</html>
