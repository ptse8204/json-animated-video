name: Provider setup failure
description: Report a local, hosted, detector, SAM, or model-planner setup problem.
title: "[Provider]: "
labels:
  - provider setup
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Never paste raw provider keys, hosted endpoint bearer tokens, signed URLs, private frames, or full local paths. Hosted setup checks should not send frames unless a route explicitly says it is a hosted smoke test and you opted in. Any hosted run should require hosted-call opt-in plus cost/privacy acknowledgement.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - mock/no-model
        - threshold
        - motion foreground
        - external masks
        - sam2-local
        - sam2-hosted
        - sam3-local
        - sam3-hosted
        - text detector
        - class detector
        - openai planner
        - openrouter planner
        - FFmpeg/video rendering
        - Other
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Where did setup fail?
      options:
        - Local UI provider settings
        - Local UI extraction flow
        - CLI diagnostics
        - CLI extraction
        - Backend API route
        - Tests or CI
    validations:
      required: true
  - type: textarea
    id: redacted_status
    attributes:
      label: Redacted readiness or diagnostics
      description: Paste redacted output from provider readiness, diagnostics, or setup tests.
      render: shell
      placeholder: |
        python3 -m motionjson.cli backend diagnostics --json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and cost boundary
      options:
        - label: I removed API keys, bearer tokens, signed URLs, private media, and full local paths.
          required: true
        - label: I understand hosted providers can have cost/privacy impact and should require explicit opt-in before network calls.
          required: true
