version: 2
always_read:
  - docs/codex/START_HERE.md
  - docs/codex/CURRENT_TASK.md
  - docs/codex/SAFETY_INVARIANTS.md
  - docs/codex/CURRENT_ARCHITECTURE.md
  - docs/codex/CONTEXT_MANIFEST.yaml

never_default_read:
  - docs/archive/
  - docs/roadmap/phase-*-report.md
  - docs/roadmap/final-*.md
  - docs/roadmap/
  - docs/local_ui.md
  - docs/design/
  - codex_prompt_pack/

subsystems:
  ui_redesign:
    docs:
      - docs/product/ui_redesign_brief.md
      - docs/codex/SAFETY_INVARIANTS.md
      - docs/codex/CURRENT_ARCHITECTURE.md
    source_paths:
      - src/motionjson/ui/server.py
      - src/motionjson/ui/static/
      - scripts/check_local_ui_layout.mjs
      - scripts/test_ui_config_builder.mjs
      - scripts/test_ui_modules.mjs
      - scripts/test_ui_workflow_matrix.mjs
    commands:
      - npm run build
      - npm test
      - npm run lint
      - npm run ui:layout

  provider_security:
    docs:
      - docs/codex/SAFETY_INVARIANTS.md
      - docs/security/api_keys.md
      - docs/provider_capabilities.md
    source_paths:
      - src/motionjson/provider_settings.py
      - src/motionjson/provider_registry.py
      - src/motionjson/capabilities.py
      - src/motionjson/backend/api_keys.py
      - src/motionjson/model_connectors/contracts.py
      - src/motionjson/providers/
    commands:
      - python3 -m pytest -q tests/test_provider_settings.py tests/test_provider_registry.py tests/test_capabilities.py tests/test_model_connectors.py
      - python3 -m motionjson.cli backend diagnostics --json

  extraction_pipeline:
    docs:
      - docs/codex/CURRENT_ARCHITECTURE.md
      - docs/provider_pipeline.md
      - docs/track_filtering.md
    source_paths:
      - src/motionjson/config.py
      - src/motionjson/pipeline.py
      - src/motionjson/track_filters.py
      - src/motionjson/providers/
      - src/motionjson/adapters/
      - src/motionjson/backend/worker.py
    commands:
      - python3 -m pytest -q tests/test_config.py tests/test_provider_pipeline.py tests/test_discovery_providers.py tests/test_track_filtering.py
      - python3 -m motionjson.cli extract --help

  runtime_export:
    docs:
      - docs/codex/CURRENT_ARCHITECTURE.md
      - docs/runtime.md
      - docs/final_export.md
    source_paths:
      - src/motionjson/exporters/
      - src/motionjson/schemas/
      - src/motionjson/rights.py
      - packages/motionjson-runtime/
      - packages/motionjson-sdk/
    commands:
      - python3 -m pytest -q tests/test_final_export.py tests/test_schema_validation.py tests/test_rights_metadata.py
      - npm test

  release:
    docs:
      - docs/index.md
      - docs/release_checklist.md
      - docs/release_notes.md
    source_paths:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - pyproject.toml
      - package.json
      - packages/
      - .github/
    commands:
      - python3 -m pytest -q tests/test_docs_links.py tests/test_phase10_release_hardening.py tests/test_phase14_release_candidate.py
      - npm test
      - git diff --check

  docs_harness:
    docs:
      - docs/codex/START_HERE.md
      - docs/codex/CURRENT_TASK.md
      - docs/codex/CONTEXT_MANIFEST.yaml
    source_paths:
      - AGENTS.md
      - CODEX_MASTER_PROMPT.md
      - codex_tasks.yaml
      - scripts/check_codex_context_budget.py
      - tests/test_docs_links.py
    commands:
      - python3 scripts/check_codex_context_budget.py
      - python3 -m pytest -q tests/test_docs_links.py
      - git diff --check
