project: motionjson
mission: local_first_video_object_tracing_ui
active_roadmap:
  id: ui_model_connector
  doc: docs/roadmap/ui_model_connector_plan.md
  status: active
  goal: >
    Turn the Local UI into a nontechnical guided object-tracing workflow and
    add a safe server-side model planning connector while preserving
    CPU/mock/no-model operation, CLI compatibility, optional heavy dependencies,
    visible provider diagnostics, and server-side-only secrets.
  preserves_history:
    - docs/codex_motionjson_roadmap.md
    - docs/roadmap/phase-0-report.md through docs/roadmap/phase-14-report.md
    - docs/roadmap/phase-od-00-report.md through docs/roadmap/phase-od-14-report.md
phase_policy:
  execute_in_order: true
  commit_required_after_each_phase: true
  phase_report_required: true
  phase_report_path_template: docs/roadmap/phase-{phase_id}-report.md
  reviewer_required_before_commit: true
  preserve_cli_behavior: true
  heavy_dependencies_optional: true
  mock_mode_required: true
  master_agent_owns_execution: true
  bounded_read_only_scouts: true
  browser_screenshots_required_for_ui_layout: true
  no_hosted_calls_without_explicit_opt_in: true
subagents:
  - name: repo_archaeologist
    role: Map current repository structure, CLI, tests, dependencies, and execution paths.
  - name: product_strategist
    role: Keep user workflows, naming, acceptance criteria, and adoption goals coherent.
  - name: backend_cv_architect
    role: Design and implement provider abstractions, extraction pipeline, tracking, diagnostics, and exports.
  - name: frontend_ui_engineer
    role: Design and implement local UI, canvas workflow, job integration, and result review.
  - name: qa_benchmark_engineer
    role: Build test strategy, fixtures, mocks, benchmarks, and regression checks.
  - name: docs_devrel_engineer
    role: Write docs, tutorials, examples, and troubleshooting content.
  - name: release_packaging_engineer
    role: Package UI, dependency extras, launchers, setup checks, and release readiness.
  - name: reviewer
    role: Review diffs against acceptance criteria, correctness, risk, and tests.
scouts:
  - name: plan-risk-scout
    role: Critique phase plans and API shapes before implementation.
    mode: read_only
  - name: diff-review-scout
    role: Review final diffs for correctness, secrets, and regressions.
    mode: read_only
  - name: rendering-scout
    role: Review browser screenshots, layout behavior, and visual regressions.
    mode: read_only
  - name: test-gap-scout
    role: Check whether tests cover behavior, edge cases, and regressions.
    mode: read_only
  - name: adoption-scout
    role: Check whether the feature helps real users, especially less technical users.
    mode: read_only
ui_model_connector_phases:
  - id: UI-MODEL-00
    name: align Codex workflow with model connector roadmap
    commit_message: "phase ui-model-00: align codex workflow with model connector roadmap"
    report: docs/roadmap/phase-ui-model-00-report.md
    goals:
      - Update repo-level Codex instructions for this roadmap and master-agent workflow.
      - Add a self-contained roadmap that does not depend on hidden chat context.
      - Preserve existing phase history.
    validation:
      - "docs link checks if available"
      - "python3 -m motionjson.cli --help"
      - "git diff --check"
  - id: UI-LAYOUT-01
    name: browser-driven layout and readability overhaul
    commit_message: "phase ui-layout-01: improve local ui readability and card layout"
    report: docs/roadmap/phase-ui-layout-01-report.md
    goals:
      - Improve Local UI card layout, fonts, spacing, panel density, right-rail hierarchy, review/export card hierarchy, and responsive behavior.
      - Capture browser-rendered before and after screenshots across required viewports and UI states.
      - Strengthen layout checks for overflow, overlap, clipped text, and too-narrow cards.
    validation:
      - "npm run build"
      - "npm run ui:layout -- --screenshot-dir docs/design/screenshots/ui-layout-01"
      - "python3 scripts/capture_docs_assets.py --out-dir docs/design/screenshots/ui-layout-01-docs || document failure"
  - id: UI-MODEL-01
    name: nontechnical first-run wizard
    commit_message: "phase ui-model-01: add guided first-run wizard"
    report: docs/roadmap/phase-ui-model-01-report.md
    goals:
      - Add a guided default path for adding video, choosing a goal, validating a plan, running, reviewing, and exporting.
      - Keep local path registration and raw config preview under Advanced.
      - Add clear empty, error, loading, and success states.
    validation:
      - "npm run build"
      - "npm run ui:layout -- --screenshot-dir docs/design/screenshots/ui-model-01"
      - "npm test"
  - id: UI-MODEL-02
    name: model connector backend contract
    commit_message: "phase ui-model-02: add model connector contract"
    report: docs/roadmap/phase-ui-model-02-report.md
    goals:
      - Add typed model connector interfaces, request/result/event models, and a fake deterministic connector.
      - Add API routes for provider listing, readiness, test, estimate, model runs, events, cancellation, and job model-plan attachment.
      - Keep all credentials server-side and keep default tests no-network.
    validation:
      - "python3 -m pytest -q tests -k 'model or provider or ui'"
      - "secret-redaction tests"
      - "no-network default tests"
  - id: UI-MODEL-03
    name: provider settings to connector wiring
    commit_message: "phase ui-model-03: wire provider settings to model connectors"
    report: docs/roadmap/phase-ui-model-03-report.md
    goals:
      - Reuse provider settings and redaction policy for connector readiness.
      - Add hosted-call opt-in checks and no-network hosted setup checks.
      - Preserve local/mock defaults.
    validation:
      - "provider settings tests"
      - "no-secret response tests"
      - "hosted opt-in tests"
      - "no-network default tests"
  - id: UI-MODEL-04
    name: OpenAI planning connector MVP
    commit_message: "phase ui-model-04: add openai planning connector"
    report: docs/roadmap/phase-ui-model-04-report.md
    goals:
      - Add server-side OpenAI planning connector for intent parsing and run-plan generation.
      - Use mocked transport in tests and never call hosted APIs by default.
      - Validate model output as a proposed run plan before enqueueing extraction.
    validation:
      - "mocked OpenAI transport tests"
      - "structured schema validation"
      - "redaction and failure-mode tests"
  - id: UI-MODEL-05
    name: UI connect-model flow
    commit_message: "phase ui-model-05: add model setup wizard"
    report: docs/roadmap/phase-ui-model-05-report.md
    goals:
      - Add model setup flow for local/mock/hosted providers.
      - Show readiness, privacy, cost, missing config, invalid config, and test results.
      - Store raw secrets only server-side.
    validation:
      - "npm run build"
      - "npm run ui:layout -- --screenshot-dir docs/design/screenshots/ui-model-05"
      - "npm test"
      - "python3 -m pytest -q tests -k 'provider or model or ui'"
  - id: UI-MODEL-06
    name: model plan to extraction run
    commit_message: "phase ui-model-06: route model plans into extraction jobs"
    report: docs/roadmap/phase-ui-model-06-report.md
    goals:
      - Convert validated model plans into ExtractionRunConfig.
      - Require user confirmation before enqueueing extraction jobs.
      - Stream model-plan and extraction progress through existing job/event UI.
    validation:
      - "config golden tests"
      - "API E2E with fake connector"
      - "mock extraction E2E"
      - "UI layout tests for run-plan cards"
  - id: UI-MODEL-07
    name: review UX upgrade
    commit_message: "phase ui-model-07: improve guided review and correction ux"
    report: docs/roadmap/phase-ui-model-07-report.md
    goals:
      - Improve candidate cards, thumbnails, statuses, suggested retries, correction explanations, and reviewed-only export gating.
      - Default exports to reviewed selected objects only.
    validation:
      - "UI layout checks"
      - "API review tests"
      - "export validation tests"
  - id: UI-MODEL-08
    name: seamless export handoff
    commit_message: "phase ui-model-08: simplify export handoff"
    report: docs/roadmap/phase-ui-model-08-report.md
    goals:
      - Add one-click export cards for Website package, MotionJSON scene, Runtime snippet, Remotion plan, and Developer handoff.
      - Show rights warnings and reviewed-object status in plain language.
      - Improve success state with copyable next steps.
    validation:
      - "export tests"
      - "embed smoke"
      - "docs examples"
      - "UI layout checks"
  - id: UI-MODEL-09
    name: Codex operational integration
    commit_message: "phase ui-model-09: add codex operational prompts"
    report: docs/roadmap/phase-ui-model-09-report.md
    goals:
      - Add prompt docs for UI layout review, browser screenshot review, model connector review, release audit, and review-only scouts.
      - Update AGENTS review guidelines.
      - Avoid unsafe automation that can push without review.
    validation:
      - "CI dry-run/config checks where available"
      - "docs link checks"
  - id: UI-MODEL-10
    name: release hardening
    commit_message: "phase ui-model-10: harden release readiness"
    report: docs/roadmap/phase-ui-model-10-report.md
    goals:
      - Resolve or document license status.
      - Update issue templates, release checklist, screenshot freshness checks, and security recommendations.
      - Update README/docs to match implemented features only.
    validation:
      - "full available CI"
      - "release checklist"
      - "docs link checks"
      - "screenshot freshness check"
  - id: UI-WORKFLOW-11
    name: guided workflow rescue and inline run/review shell
    commit_message: "phase ui-workflow-11: streamline guided run and review workflow"
    report: docs/roadmap/phase-ui-workflow-11-report.md
    goals:
      - Promote the simplified one-frame object pick flow to a first-class goal.
      - Remove right-rail dependence from the default review/correction/export path.
      - Show inline live run previews, terminal-style logs, and more precise progress.
      - Add optional lightweight automatic object naming for placeholder labels.
    validation:
      - "npm run build"
      - "npm test"
      - "npm run lint"
      - "python3 -m pytest -q tests/test_image_classifier.py tests/test_model_setup_recommendations.py tests/test_ui_first_run_simplicity.py"
      - "python3 -m pytest -q tests/test_local_ui_api.py -k 'review or export or provider'"
      - "python3 -m motionjson.cli --help"
      - "python3 -m motionjson.cli ui --help"
      - "git diff --check"
  - id: UI-WORKFLOW-12
    name: finish keyframe-first tracking workflow
    commit_message: "phase ui-workflow-12: finish keyframe-first tracking workflow"
    report: docs/roadmap/phase-ui-workflow-12-report.md
    goals:
      - Split keyframe scan from full selected tracking.
      - Add the queued selected-only child job flow.
      - Tighten the compact editor shell and model-setup gating.
      - Switch automatic naming to no-token local public weights.
    validation:
      - "npm run build"
      - "npm test"
      - "npm run lint"
      - "python3 -m pytest -q tests/test_fast_keyframe_workflow.py tests/test_image_classifier.py tests/test_model_setup_recommendations.py tests/test_ui_first_run_simplicity.py tests/test_local_ui_api.py -k 'track_selected or export or provider or preview_file_route_serves_imported_result_directories or keyframe_scan'"
      - "python3 -m motionjson.cli --help"
      - "python3 -m motionjson.cli ui --help"
      - "git diff --check"
  - id: UI-WORKFLOW-13
    name: correct inline workflow gaps
    commit_message: "phase ui-workflow-13: correct inline workflow gaps"
    report: docs/roadmap/phase-ui-workflow-13-report.md
    goals:
      - Remove all-panels/right-rail dependence from the default shell.
      - Show advanced tracing tasks inline by default.
      - Require explicit scan-frame confirmation for the keyframe-first path.
      - Register live candidate/object preview artifacts while jobs run.
      - Keep export gate focused on readiness, included objects, rights, and handoff actions.
    validation:
      - "npm run build"
      - "npm test"
      - "npm run lint"
      - "python3 -m pytest -q tests/test_ui_first_run_simplicity.py tests/test_fast_keyframe_workflow.py"
      - "python3 -m pytest -q tests/test_image_classifier.py tests/test_model_setup_recommendations.py"
      - "python3 -m pytest -q tests/test_local_ui_api.py tests/test_backend_api_product.py tests/test_backend_jobs_worker.py tests/test_job_artifacts.py tests/test_job_lifecycle.py"
      - "python3 -m motionjson.cli --help"
      - "python3 -m motionjson.cli ui --help"
      - "npm run ui:layout -- --screenshot-dir docs/design/screenshots/ui-workflow-13 --state first-run,model-setup-sam3-local,prepare-pick-frame,workflow-run,candidate-review,correction-tools,export-gate --viewport mobile-390,tablet-768,tablet-1024,laptop-1366,desktop-1440,desktop-1920"
      - "git diff --check"
  - id: UI-WORKFLOW-14
    name: add raster acceleration progress and benchmarks
    commit_message: "phase ui-workflow-14: add raster acceleration telemetry"
    report: docs/roadmap/phase-ui-workflow-14-report.md
    goals:
      - Use one capability-gated CPU/CUDA/MPS resolver for raster/vector acceleration.
      - Expose requested device, actual device, backend, fallback reason, and elapsed timings in job progress and providerPerformance.
      - Add a raster/vector microbenchmark to extraction benchmark reports.
      - Preserve CPU fallback and final CPU/OpenCV contour extraction.
    validation:
      - "python3 -m pytest -q tests/test_raster_acceleration.py"
      - "python3 -m pytest -q tests/test_provider_pipeline.py tests/test_benchmark.py"
      - "python3 -m pytest -q tests/test_job_artifacts.py tests/test_production_asset_formats.py"
      - "python3 -m motionjson.cli --help"
      - "python3 -m motionjson.cli benchmark --help"
      - "git diff --check"
historical_completed_phases:
  - id: 0
    name: repository discovery and guardrails
    commit_message: "phase 0: map repository and codex guardrails"
    agents: [repo_archaeologist, product_strategist, qa_benchmark_engineer, reviewer]
    goals:
      - Map existing repository modules, CLI commands, extraction flow, examples, and tests.
      - Identify SAM2 path and raster fallback behavior.
      - Install or update repository-level Codex instructions.
    deliverables:
      - AGENTS.md
      - docs/roadmap/phase-0-report.md
      - Current architecture/test map.
    acceptance:
      - Existing smoke commands are documented.
      - Risky areas and unknowns are listed.
      - No unnecessary product code changes.
    tests:
      - "python -m motionjson.cli --help || document failure"
      - "python -m motionjson.cli extract --help || document failure"
  - id: 1
    name: typed project and run config foundation
    commit_message: "phase 1: add typed extraction run configuration"
    agents: [backend_cv_architect, repo_archaeologist, qa_benchmark_engineer, reviewer]
    goals:
      - Create typed configs shared by CLI and UI.
      - Validate prompts, providers, sampling, export options, and debug settings.
    deliverables:
      - Run config models.
      - Config serialization/deserialization.
      - Config validation tests.
    acceptance:
      - Existing CLI can build config internally.
      - Invalid configs produce clear messages.
      - Tests cover key prompt/sampling/provider cases.
    tests:
      - "python -m pytest tests -k config || document unavailable"
  - id: 2
    name: provider capability registry and diagnostics
    commit_message: "phase 2: add provider capability diagnostics"
    agents: [backend_cv_architect, qa_benchmark_engineer, docs_devrel_engineer, reviewer]
    goals:
      - Add capability registry for providers and environment checks.
      - Report availability, missing dependencies, models, device, and install hints.
    deliverables:
      - Provider registry.
      - CLI/backend diagnostics JSON output.
      - Tests with mocked missing providers.
    acceptance:
      - Missing optional dependencies do not break base CLI.
      - CUDA is reported, not assumed.
      - Diagnostics are machine-readable.
    tests:
      - "python -m motionjson.cli backend --help || document failure"
      - "python -m pytest tests -k capability || document unavailable"
  - id: 3
    name: job engine and artifact model
    commit_message: "phase 3: add extraction job and artifact model"
    agents: [backend_cv_architect, qa_benchmark_engineer, reviewer]
    goals:
      - Add local job lifecycle and structured artifacts.
      - Emit progress events for future UI.
    deliverables:
      - Job state model.
      - Artifact directory structure.
      - Events/logs/metrics output.
    acceptance:
      - Run produces structured artifact directory.
      - Failure writes readable diagnostics.
      - Existing CLI behavior remains usable.
    tests:
      - "python -m pytest tests -k job || document unavailable"
  - id: 4
    name: extraction provider abstraction refactor
    commit_message: "phase 4: refactor extraction into provider pipeline"
    agents: [backend_cv_architect, repo_archaeologist, qa_benchmark_engineer, reviewer]
    goals:
      - Split pipeline into discovery, masks, tracking, linking, vectorization, export.
      - Move existing single-prompt flow into abstractions.
      - Add mock providers.
    deliverables:
      - Provider interfaces.
      - Mock providers.
      - Pipeline tests.
    acceptance:
      - Existing single-prompt extraction still works.
      - Mock pipeline produces deterministic object tracks.
      - Pipeline stages are independently testable.
    tests:
      - "python -m pytest tests -k pipeline || document unavailable"
  - id: 5
    name: multi-object candidate discovery modes
    commit_message: "phase 5: add multi-object discovery providers"
    agents: [backend_cv_architect, qa_benchmark_engineer, docs_devrel_engineer, reviewer]
    goals:
      - Add/scaffold manual, auto masks, text detector, class detector, motion foreground, and external masks providers.
      - Keep heavy providers optional.
    deliverables:
      - Provider schemas.
      - At least two no-GPU usable non-manual modes via mock/simple implementations.
      - Mode docs.
    acceptance:
      - Multi-object providers feed shared pipeline.
      - Provider descriptions explain when to use each mode.
      - Missing heavy deps are capability warnings, not crashes.
    tests:
      - "python -m pytest tests -k discovery || document unavailable"
  - id: 6
    name: tracks filtering dedupe and raster fallback diagnostics
    commit_message: "phase 6: add object tracks and fallback diagnostics"
    agents: [backend_cv_architect, qa_benchmark_engineer, reviewer]
    goals:
      - Add stable ObjectTrack model and filtering.
      - Explain raster fallback with reason codes and suggestions.
    deliverables:
      - ObjectTrack model.
      - Filtering and dedupe utilities.
      - Fallback reason model.
      - Tests.
    acceptance:
      - Whole-frame masks can be flagged/rejected.
      - Raster fallback includes reason and suggested fixes.
      - Multi-object outputs have stable IDs and labels.
    tests:
      - "python -m pytest tests -k 'track or fallback or filter' || document unavailable"
  - id: 7
    name: local api server and ui shell
    commit_message: "phase 7: add local ui shell and api server"
    agents: [frontend_ui_engineer, backend_cv_architect, release_packaging_engineer, qa_benchmark_engineer, reviewer]
    goals:
      - Add local API server and frontend shell.
      - Add launch command.
      - Display capabilities.
    deliverables:
      - API app and health/capabilities routes.
      - Frontend shell.
      - motionjson ui command.
    acceptance:
      - Local UI opens from documented command.
      - Health/capabilities visible.
      - Frontend build or smoke test passes.
    tests:
      - "python -m pytest tests -k api || document unavailable"
      - "npm run build || document if frontend not npm-based"
  - id: 8
    name: video prompt tools and extraction wizard
    commit_message: "phase 8: add video prompt tools and extraction wizard"
    agents: [frontend_ui_engineer, product_strategist, backend_cv_architect, qa_benchmark_engineer, reviewer]
    goals:
      - Add video canvas and prompt tools.
      - Add goal-first extraction wizard.
    deliverables:
      - Video viewer.
      - Point/box/mask/label/keyframe tools.
      - Wizard presets.
      - Config preview/save.
    acceptance:
      - UI builds valid backend configs.
      - Pixel coordinates are native video coordinates.
      - Provider unavailability is warned before run.
    tests:
      - "frontend tests for config builder and coordinate mapping || document unavailable"
  - id: 9
    name: ui job execution and result review
    commit_message: "phase 9: add ui job execution and result review"
    agents: [frontend_ui_engineer, backend_cv_architect, qa_benchmark_engineer, reviewer]
    goals:
      - Run jobs from UI and show progress/logs/artifacts.
      - Display tracks and fallback diagnostics.
    deliverables:
      - Job start/progress UI.
      - Track list and overlay viewer.
      - Artifact browser.
    acceptance:
      - Mock extraction runs end-to-end from UI.
      - At least one track renders over video/frame viewer.
      - Failed/raster fallback runs show useful messages.
    tests:
      - "frontend/API mock job E2E smoke || document unavailable"
  - id: 10
    name: correction tools and partial reruns
    commit_message: "phase 10: add track correction workflows"
    agents: [frontend_ui_engineer, backend_cv_architect, qa_benchmark_engineer, reviewer]
    goals:
      - Add relabel, hide, delete, merge, split, add object, and repair workflows.
      - Persist correction history.
    deliverables:
      - Track edit API.
      - Correction UI.
      - Project state persistence for edits.
    acceptance:
      - Corrections survive reload.
      - Export inclusion reflects edits.
      - Track edit operations have tests.
    tests:
      - "python -m pytest tests -k track_edit || document unavailable"
  - id: 11
    name: export validation and interoperability
    commit_message: "phase 11: add validated export workflows"
    agents: [backend_cv_architect, frontend_ui_engineer, qa_benchmark_engineer, docs_devrel_engineer, reviewer]
    goals:
      - Export edited project state to validated MotionJSON.
      - Generate optional masks/contours/preview artifacts.
    deliverables:
      - Export API/UI.
      - Validation flow.
      - Preview artifact generation.
    acceptance:
      - UI exports valid MotionJSON.
      - Export includes provenance/config metadata.
      - CLI export behavior is preserved or documented.
    tests:
      - "python -m pytest tests -k export || document unavailable"
  - id: 12
    name: evaluation fixtures and benchmarks
    commit_message: "phase 12: add evaluation fixtures and benchmarks"
    agents: [qa_benchmark_engineer, backend_cv_architect, docs_devrel_engineer, reviewer]
    goals:
      - Add synthetic fixtures and benchmark command.
      - Measure extraction quality and regressions.
    deliverables:
      - Fixture generator.
      - Benchmark runner.
      - Summary report outputs.
    acceptance:
      - Benchmarks run without GPU.
      - Whole-frame regression case exists.
      - Demo videos have documented expected behavior.
    tests:
      - "python -m motionjson.cli benchmark --help || document unavailable"
      - "python -m pytest tests -k benchmark || document unavailable"
  - id: 13
    name: packaging and onboarding docs
    commit_message: "phase 13: add packaging and onboarding docs"
    agents: [release_packaging_engineer, docs_devrel_engineer, frontend_ui_engineer, qa_benchmark_engineer, reviewer]
    goals:
      - Add extras/launchers/setup wizard/docs/examples.
      - Make install and first run easier.
    deliverables:
      - Dependency extras.
      - First-run diagnostics/setup docs.
      - Tutorials and PowerShell-safe examples.
    acceptance:
      - User can run documented install and launch commands.
      - Missing dependencies/models are explained.
      - Red-ball and multi-object demos are documented.
    tests:
      - "packaging metadata validation || document unavailable"
  - id: 14
    name: polish accessibility performance release candidate
    commit_message: "phase 14: prepare ui multi-object tracing release candidate"
    agents: [frontend_ui_engineer, backend_cv_architect, qa_benchmark_engineer, docs_devrel_engineer, release_packaging_engineer, reviewer]
    goals:
      - Polish UI, accessibility, performance, privacy, and release notes.
      - Run final smoke tests.
    deliverables:
      - Release notes.
      - Migration/known limitations.
      - Final QA report.
    acceptance:
      - CLI and UI smoke pass.
      - At least one end-to-end UI workflow completes.
      - Known limitations are documented.
    tests:
      - "full available test suite"
      - "manual QA checklist in docs/codex_motionjson_quality_benchmarks.md"
