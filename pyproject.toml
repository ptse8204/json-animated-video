[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionjson"
version = "0.1.0"
description = "AI object-layer editing for video and web graphics with reusable JSON-controlled motion layers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python", "Pillow", "tqdm", "jsonschema>=4.22", "attrs>=23.1"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
ui = []
sam2 = ["torch>=2.1", "sam2"]
sam2-transformers = ["torch>=2.7", "transformers>=5.0", "accelerate>=1.0"]
sam3 = ["torch>=2.7"]
sam3-transformers = ["torch>=2.7", "transformers>=5.0", "accelerate>=1.0"]
detectors = ["groundingdino-py>=0.4"]
yolo = ["ultralytics>=8"]
hosted-segmentation = ["requests>=2.31"]
hosted-sam3 = ["requests>=2.31"]
hosted-sam-vendors = ["requests>=2.31", "replicate>=1.0", "fal-client>=0.7"]
openrouter = ["requests>=2.31"]
dev = ["pytest>=8", "build>=1.2", "wheel>=0.43", "tomli>=2; python_version<'3.11'"]

[project.scripts]
motionjson = "motionjson.cli:main"

[project.urls]
Homepage = "https://github.com/ptse8204/json-animated-video"
Repository = "https://github.com/ptse8204/json-animated-video"
Issues = "https://github.com/ptse8204/json-animated-video/issues"
Documentation = "https://github.com/ptse8204/json-animated-video/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motionjson = ["schemas/*.json", "ui/static/*", "ui/static/**/*"]
