[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionjson"
version = "0.1.0"
description = "AI object-layer editing for video and web graphics with reusable JSON-controlled motion layers"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python", "Pillow", "tqdm", "jsonschema>=4.22", "attrs>=23.1"]

[project.scripts]
motionjson = "motionjson.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motionjson = ["schemas/*.json"]
