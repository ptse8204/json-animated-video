<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>MotionJSON Education Template</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      color: #172033;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    header {
      display: grid;
      gap: 8px;
      padding: 22px 28px;
      border-bottom: 1px solid #c9d4e2;
      background: #ffffff;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.4rem);
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #59687c;
      line-height: 1.5;
    }
    .lesson {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: 0;
    }
    .stage {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    #motion {
      width: min(920px, 100%);
      aspect-ratio: 16 / 9;
      border: 1px solid #c9d4e2;
      background: #f4f7fb;
    }
    #motion canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    aside {
      display: grid;
      align-content: start;
      gap: 10px;
      padding: 18px;
      border-left: 1px solid #c9d4e2;
      background: #eef3f8;
    }
    button {
      min-height: 38px;
      border: 1px solid #bdcad9;
      border-radius: 6px;
      padding: 0 12px;
      background: #ffffff;
      color: #172033;
      font-weight: 750;
      cursor: pointer;
      text-align: left;
    }
    button:hover { border-color: #3a7bd5; }
    @media (max-width: 820px) {
      .lesson { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid #c9d4e2; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Explainer motion layer</h1>
      <p>Use cached object motion in lessons, annotations, and interactive articles without rerunning extraction during playback.</p>
    </header>
    <section class="lesson">
      <div class="stage">
        <div
          id="motion"
          data-motionjson-src=""
          data-motionjson-template="education"
          data-motionjson-background="#f4f7fb"
        ></div>
      </div>
      <aside>
        <button data-state="idle">Step 1: play the layer</button>
        <button data-state="hover">Step 2: emphasize the object</button>
        <button data-state="click">Step 3: trigger an annotation</button>
        <p id="status">Loading template...</p>
      </aside>
    </section>
  </main>
  <script type="module">
    const path = location.pathname;
    const fromPreview = path.includes("/preview/website_templates/");
    const fromPackage = !path.includes("/examples/") && path.includes("/templates/");
    const runtimePath = fromPreview || fromPackage
      ? "../runtime/index.js"
      : "../../packages/motionjson-runtime/src/index.js";
    const { autoMountMotionJSON } = await import(runtimePath);
    const params = new URLSearchParams(location.search);
    const fallbackManifest = fromPreview ? "../../web_asset_manifest.json" : fromPackage ? "../web_asset_manifest.json" : "/out/demo/web_asset_manifest.json";
    document.getElementById("motion").dataset.motionjsonSrc = params.get("manifest") || fallbackManifest;
    const [handle] = await autoMountMotionJSON();
    document.getElementById("status").textContent = `Loaded ${handle.scene.assetId}; interactions use JSON transforms.`;
    for (const button of document.querySelectorAll("button[data-state]")) {
      button.addEventListener("click", () => handle.runtime.setState(button.dataset.state));
    }
  </script>
</body>
</html>
